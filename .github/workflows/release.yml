# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build
# TIDALOID.exe on Windows and publish it as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # manual run: builds the exe and keeps it as a workflow artifact

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build TIDALOID.exe
        run: pyinstaller --noconfirm --clean tidaloid.spec

      - name: Smoke test (the app must at least import)
        run: python -c "import ast; ast.parse(open('tidaloid.pyw', encoding='utf-8').read())"

      - name: Name the asset after the tag
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { "TIDALOID-$env:GITHUB_REF_NAME-windows-x64.exe" } else { "TIDALOID-windows-x64.exe" }
          Move-Item dist\TIDALOID.exe "dist\$name"
          "ASSET=dist\$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: TIDALOID-windows-x64
          path: ${{ env.ASSET }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            **Download:** `TIDALOID-${{ github.ref_name }}-windows-x64.exe` below. No install needed, just run it.

            Also install FFmpeg for previews, FLAC remuxing and videos: `winget install Gyan.FFmpeg`

            Windows SmartScreen may warn because the exe is unsigned: click **More info → Run anyway**.
